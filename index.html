<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>LUMEN — 지문 분석 AI</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'dark', themeVariables: { primaryColor: '#00d4ff20', primaryTextColor: '#f0f0ff', primaryBorderColor: '#00d4ff', lineColor: '#00d4ff80', secondaryColor: '#a855f720', tertiaryColor: '#1a1a2e', background: 'transparent', mainBkg: '#1a1a2e', textColor: '#f0f0ff' } });
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ─── NOISE TEXTURE OVERLAY ─── -->
<div class="noise-overlay" aria-hidden="true"></div>

<!-- ─── AMBIENT GLOW ─── -->
<div class="ambient" aria-hidden="true">
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>
</div>

<!-- ─── LOADING SCREEN ─── -->
<div id="loadingScreen" class="loading-screen hidden">
  <div class="loading-inner">
    <div class="loading-ring">
      <svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" /></svg>
    </div>
    <p class="loading-label" id="loadingText">분석 중...</p>
    <div class="loading-steps" id="loadingSteps">
      <span class="step active">언어 감지</span>
      <span class="step">구조 분석</span>
      <span class="step">문제 생성</span>
      <span class="step">완료</span>
    </div>
  </div>
</div>

<!-- ─── TOAST ─── -->
<div id="toast" class="toast hidden"></div>

<!-- ─── TOPBAR ─── -->
<header class="topbar">
  <div class="topbar-brand">
    <span class="brand-mark">L</span>
    <span class="brand-name">LUMEN</span>
    <span class="brand-tag">지문 분석 AI</span>
  </div>
  <nav class="topbar-actions">
    <button class="nav-btn" id="timerBtn" title="포모도로">⏱</button>
    <button class="nav-btn" id="historyBtn" title="기록">⧉</button>
    <button class="nav-btn" id="compareBtn" title="비교">⚖</button>
    <button class="nav-btn" id="settingsBtn" title="설정">⚙</button>
    <button class="nav-btn theme-toggle" id="themeBtn" title="라이트/다크">◐</button>
  </nav>
</header>

<!-- ─── LAYOUT ─── -->
<div class="layout">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <!-- Grade + Input controls -->
    <div class="sidebar-section">
      <label class="field-label">학년</label>
      <select id="gradeSelect" class="field-select">
        <option value="middle1">중1</option>
        <option value="middle2">중2</option>
        <option value="middle3">중3</option>
        <option value="high1" selected>고1</option>
        <option value="high2">고2</option>
        <option value="high3">고3</option>
        <option value="csat">수능</option>
      </select>
    </div>

    <!-- File Upload -->
    <div class="sidebar-section">
      <label class="field-label">파일 업로드</label>
      <div class="dropzone" id="dropZone">
        <div class="dropzone-inner">
          <div class="dropzone-icon">↑</div>
          <p>PDF · DOCX · TXT · 이미지</p>
          <p class="dropzone-hint">드래그하거나 클릭</p>
        </div>
        <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.png,.jpg,.jpeg" hidden />
      </div>
      <div id="uploadStatus" class="upload-status hidden"></div>
    </div>

    <!-- Text Input -->
    <div class="sidebar-section grow">
      <div class="field-label-row">
        <label class="field-label">지문 입력</label>
        <span id="langBadge" class="lang-pill">자동</span>
      </div>
      <textarea
        id="inputText"
        class="field-textarea"
        placeholder="국어 또는 영어 지문을 붙여넣으세요..."
        spellcheck="false"
      ></textarea>
      <div class="textarea-meta">
        <span id="charCount">0자</span>
        <div class="meta-actions">
          <button id="ttsBtn" class="ghost-btn">🔊</button>
          <button id="clearBtn" class="ghost-btn danger">✕</button>
        </div>
      </div>
    </div>

    <!-- TTS Controls -->
    <div id="ttsBar" class="tts-bar hidden">
      <button id="ttsPause" class="tts-ctrl">⏸</button>
      <button id="ttsStop" class="tts-ctrl stop">⏹</button>
      <input type="range" id="ttsSpeed" min="0.5" max="2" step="0.1" value="1" />
      <span id="ttsSpeedVal">1.0×</span>
    </div>

    <!-- Analyze CTA -->
    <button id="analyzeBtn" class="cta-btn">
      <span class="cta-icon">◈</span>
      <span>지문 분석하기</span>
      <span class="cta-arrow">→</span>
    </button>

    <!-- Compare input (hidden by default) -->
    <div id="compareSection" class="compare-section hidden">
      <label class="field-label">비교 지문</label>
      <textarea id="compareText" class="field-textarea short" placeholder="두 번째 지문..."></textarea>
      <button id="compareRunBtn" class="cta-btn secondary">비교 분석 →</button>
    </div>

    <!-- Pomodoro widget -->
    <div id="timerWidget" class="timer-widget hidden">
      <div id="timerDisplay" class="timer-clock">25:00</div>
      <div class="timer-modes">
        <button class="tmode active" data-min="25">집중</button>
        <button class="tmode" data-min="5">휴식</button>
        <button class="tmode" data-min="15">긴 휴식</button>
      </div>
      <div class="timer-row">
        <button id="timerStart" class="timer-play">▶ 시작</button>
        <button id="timerReset" class="timer-reset">↩</button>
      </div>
      <p class="timer-stat">오늘 완료 <span id="pomodoroCount">0</span>회</p>
    </div>

  </aside>

  <!-- MAIN CONTENT -->
  <main class="content" id="content">

    <!-- HERO (shown before analysis) -->
    <section class="hero" id="hero">
      <div class="hero-inner">
        <h1 class="hero-headline">
          <span class="hero-word">읽고</span>
          <span class="hero-word accent">분석하고</span>
          <span class="hero-word">이해하다</span>
        </h1>
        <p class="hero-sub">지문을 붙여넣으면 AI가 요약·마인드맵·예상 문제까지 한 번에 만들어드립니다</p>
        <div class="hero-features">
          <div class="hf">🇰🇷 국어 자동 감지</div>
          <div class="hf">🇺🇸 영어 지원</div>
          <div class="hf">📊 시각화</div>
          <div class="hf">❓ 예상 문제</div>
          <div class="hf">🎙 음성 읽기</div>
          <div class="hf">📅 복습 계획</div>
        </div>
      </div>
    </section>

    <!-- RESULT AREA (shown after analysis) -->
    <section class="result-area hidden" id="resultArea">

      <!-- Tab bar -->
      <div class="tab-strip">
        <button class="tab active" data-tab="summary">요약</button>
        <button class="tab" data-tab="mindmap">마인드맵</button>
        <button class="tab" data-tab="graph">그래프</button>
        <button class="tab" data-tab="cloud">워드클라우드</button>
        <button class="tab" data-tab="highlight">하이라이트</button>
        <button class="tab" data-tab="questions">예상 문제</button>
        <button class="tab" data-tab="compare">비교</button>
        <button class="tab" data-tab="history">기록</button>
        <button class="tab" data-tab="stats">통계</button>
        <button class="tab" data-tab="ai">AI 선생님</button>
        <button class="tab" data-tab="planner">복습 계획</button>
      </div>

      <!-- Export row -->
      <div class="export-row">
        <button class="ex-btn" id="exportTxt">TXT</button>
        <button class="ex-btn" id="exportMd">MD</button>
        <button class="ex-btn" id="exportPdf">PDF</button>
        <button class="ex-btn" id="copyAll">복사</button>
        <button class="ex-btn accent" id="saveBtn">저장</button>
      </div>

      <!-- ── TAB PANELS ── -->

      <div class="panel active" id="panel-summary">
        <div class="cards-grid" id="summaryGrid">
          <!-- Injected by JS -->
        </div>
        <div id="flowDiagram" class="flow-diagram"></div>
      </div>

      <div class="panel" id="panel-mindmap">
        <div class="mm-toolbar">
          <button class="mm-btn" id="mmZoomIn">+</button>
          <button class="mm-btn" id="mmZoomOut">−</button>
          <button class="mm-btn" id="mmReset">↺</button>
        </div>
        <svg id="mindmapSvg" class="mm-svg"></svg>
      </div>

      <div class="panel" id="panel-graph">
        <div class="chart-duo">
          <div class="chart-box"><h3>키워드 빈도</h3><canvas id="barChart"></canvas></div>
          <div class="chart-box"><h3>중요도 분포</h3><canvas id="pieChart"></canvas></div>
        </div>
      </div>

      <div class="panel" id="panel-cloud">
        <div id="cloudWrap" class="cloud-wrap"></div>
        <div id="cloudTip" class="cloud-tip hidden"></div>
      </div>

      <div class="panel" id="panel-highlight">
        <div id="hlContent"></div>
      </div>

      <div class="panel" id="panel-questions">
        <div id="qContent"></div>
        <div id="scorePanel" class="score-panel hidden">
          <span id="scoreTxt"></span>
          <div class="score-track"><div class="score-fill" id="scoreFill"></div></div>
        </div>
      </div>

      <div class="panel" id="panel-compare">
        <div id="compareResult"></div>
      </div>

      <div class="panel" id="panel-history">
        <div class="hist-toolbar">
          <input type="text" id="histSearch" class="field-input" placeholder="검색..." />
          <button class="ghost-btn" id="histClearBtn">전체 삭제</button>
        </div>
        <div id="histList"></div>
      </div>

      <div class="panel" id="panel-stats">
        <div class="stat-row" id="statCards"></div>
        <div class="chart-box" style="margin-top:1.5rem"><h3>주간 학습량 (분)</h3><canvas id="weeklyChart"></canvas></div>
      </div>

      <div class="panel" id="panel-ai">
        <div class="chat-wrap">
          <div id="chatHistory" class="chat-history"></div>
          <div class="chat-input-row">
            <input id="aiQ" class="field-input" placeholder="AI 선생님에게 질문하세요..." />
            <button id="aiSend" class="cta-btn small">전송</button>
          </div>
          <div class="quick-chips">
            <button class="chip" data-q="이 지문의 핵심 개념을 쉽게 설명해줘">쉽게 설명</button>
            <button class="chip" data-q="관련 추가 문제를 만들어줘">추가 문제</button>
            <button class="chip" data-q="시험에 자주 나오는 포인트가 뭐야?">시험 포인트</button>
            <button class="chip" data-q="어려운 어휘를 설명해줘">어휘 설명</button>
          </div>
        </div>
      </div>

      <div class="panel" id="panel-planner">
        <div id="plannerContent"></div>
      </div>

    </section>

  </main>
</div>

<!-- ─── SETTINGS MODAL ─── -->
<div class="modal-overlay hidden" id="settingsModal">
  <div class="modal-box">
    <div class="modal-head">
      <span>설정</span>
      <button class="modal-close" data-close="settingsModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="setting-row">
        <label class="field-label">폰트 크기</label>
        <div class="range-row">
          <input type="range" id="fontRange" min="12" max="22" value="15" />
          <span id="fontVal">15px</span>
        </div>
      </div>
      <div class="setting-row">
        <label class="field-label">색상 테마</label>
        <div class="swatch-row">
          <button class="swatch active" data-color="#00d4ff" style="background:#00d4ff"></button>
          <button class="swatch" data-color="#a855f7" style="background:#a855f7"></button>
          <button class="swatch" data-color="#22c55e" style="background:#22c55e"></button>
          <button class="swatch" data-color="#f97316" style="background:#f97316"></button>
          <button class="swatch" data-color="#f43f5e" style="background:#f43f5e"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ─── HISTORY DETAIL MODAL ─── -->
<div class="modal-overlay hidden" id="histModal">
  <div class="modal-box wide">
    <div class="modal-head">
      <span>분석 기록</span>
      <button class="modal-close" data-close="histModal">✕</button>
    </div>
    <div id="histModalBody" class="modal-body"></div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/upload.js"></script>
<script src="js/ocr.js"></script>
<script src="js/tts.js"></script>
<script src="js/analysis.js"></script>
<script src="js/mindmap.js"></script>
<script src="js/graph.js"></script>
<script src="js/wordcloud.js"></script>
<script src="js/highlight.js"></script>
<script src="js/question.js"></script>
<script src="js/grading.js"></script>
<script src="js/export.js"></script>
<script src="js/history.js"></script>
<script src="js/compare.js"></script>
<script src="js/timer.js"></script>
<script src="js/statistics.js"></script>
<script src="js/aiTeacher.js"></script>
<script src="js/studyPlanner.js"></script>
<script src="js/account.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
